<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reconocimiento facial (Demo)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./findorasections/header.css">
  <link rel="icon" href="./../src/favicon.ico" type="image/x-icon">
</head>
<body>

  <div include-html="./findorasections/header.html"></div>
  <script src="./findorasections/include.js"></script>

  <h1>Reconocimiento facial (Demo)</h1>

  <section id="camera" style="margin-top:18px; width:100%; max-width:1100px;">
    <h2>Cámaras (grid)</h2>

    <div id="container" class="grid-container"></div>

    <div style="margin-top:8px;">
      <div id="camName" style="display:inline-block; margin-left:12px;">–</div>
    </div>

    <div class="controls" style="margin-top:12px;">
      <label for="threshold" style="margin-left:12px;">Umbral: <span id="thVal">0.6</span></label>
      <input id="threshold" type="range" min="0.3" max="0.8" step="0.01" value="0.6">
      <button id="toggleDebugBtn">🔴 Mostrar punto rojo</button>
    </div>

    <h3 style="margin-top:14px;">📥 Personas detectadas (miniaturas)</h3>
    <div id="remoteList" class="detected-list"></div>

    <p id="status" style="margin-top:10px;">Cargando modelos...</p>
  </section>

  <div id="notificationContainer" style="position:fixed; bottom:20px; right:20px;"></div>

  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
