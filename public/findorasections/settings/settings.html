<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        main {
            padding: 20px;
        }

        .settings-container {
            max-width: 600px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
        }

        .option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            background: #222;
            padding: 12px 16px;
            border-radius: 10px;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
            background: #555;
            border-radius: 20px;
            cursor: pointer;
        }

        .toggle input {
            display: none;
        }

        .slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: 0.25s;
        }

        .toggle input:checked + .slider {
            transform: translateX(24px);
            background: #0f0;
        }
    </style>
</head>
<body>
    <main>
    <div class="settings-container">
        <h1>Configuración</h1>

        <div class="option">
            <span>Modo WebSocket (Cámaras Remotas + Notificaciones en Vivo)</span>
            <label class="toggle">
                <input type="checkbox" id="wsToggle" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="option">
            <span>Modo Local (Solo cámara del dispositivo actual)</span>
            <small style="opacity: 0.7">Este modo desactiva WebRTC, WS y detección remota.</small>
        </div>
    </div>
    </main>

    <script>
        // Leer preferencia guardada
        const wsToggle = document.getElementById("wsToggle");
        const saved = localStorage.getItem("useWebSocket");

        if (saved === "true") wsToggle.checked = true;
        if (saved === "false") wsToggle.checked = false;

        wsToggle.addEventListener("change", () => {
            const useWS = wsToggle.checked;
            localStorage.setItem("useWebSocket", useWS);
            alert("Configuración guardada. Reinicia la página principal para aplicar cambios.");
        });
    </script>
    <script type="module" src="./../../js/headerLoader.js"></script>
</body>
</html>
