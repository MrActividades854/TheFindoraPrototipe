<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración - Findora</title>
    <link rel="icon" href="./../../src/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./settings.css">
    <link rel="stylesheet" href="./../../global.css">
</head>
<body>
<main>

<div class="settings-layout">

    <!-- SIDEBAR -->
    <div class="settings-sidebar">

        <h2>Configuración</h2>

        <div class="menu-item active" data-section="account">
            Cuenta
        </div>

        <div class="menu-item" data-section="profiles">
            Visualización
        </div>

        <div class="menu-item" data-section="background">
            Background Detection
        </div>

        <div class="menu-item" data-section="style">
            Estilo
        </div>

    </div>


    <!-- PANEL DERECHO -->
    <div class="settings-content">

        <!-- CUENTA -->
        <div class="settings-panel active" id="account">

            <h1>Cuenta</h1>

            <div class="option">
                <div>
                    <div class="option-title">Cambiar nombre</div>
                    <div class="option-description">Actualiza tu nombre de usuario</div>
                </div>

                <button>Editar</button>
            </div>

            <div class="option">
                <div>
                    <div class="option-title">Cambiar contraseña</div>
                    <div class="option-description">Actualiza tu contraseña</div>
                </div>

                <button>Actualizar</button>
            </div>

            <div class="option">
                <div>
                    <div class="option-title">Cerrar sesión</div>
                </div>

                <button onclick="logout()">Logout</button>
            </div>

        </div>


        <!-- VISUALIZACION -->
        <div class="settings-panel" id="profiles">

            <h1>Visualización de perfiles</h1>

            <!-- aquí puedes pegar TODO lo que ya tienes -->
            <!-- thumbnails, quality, style, etc -->

        </div>


        <!-- BACKGROUND -->
        <div class="settings-panel" id="background">

            <h1>Background Detection</h1>

            <!-- aquí pega tu sección de cámara -->

        </div>


        <!-- STYLE -->
        <div class="settings-panel" id="style">

            <h1>Estilo</h1>

            <div class="option">
                <div>
                    <div class="option-title">Modo Oscuro</div>
                    <div class="option-description">
                        Cambiar tema del sistema
                    </div>
                </div>

                <label class="toggle">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>

            </div>

        </div>

    </div>

</div>

</main>

    <script type="module" src="./../../js/headerLoader.js"></script>
    <script src="./settings.js"></script>
</body>
</html>
