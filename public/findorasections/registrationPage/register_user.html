<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registrar Usuario</title>
<style>
body {
  font-family: Arial;
  background: linear-gradient(90deg,rgb(135,199,231),rgb(196,218,237));
}
.container {
  max-width: 500px;
  margin: auto;
  background: #22395a;
  padding: 20px;
  border-radius: 10px;
  color: white;
}
input, select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: none;
}
button {
  background: #238636;
  color: white;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
<h2>Registrar Usuario</h2>

<input type="text" id="name" placeholder="Nombre">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Clave">
<input type="number" id="age" placeholder="Edad">

<select id="gender">
  <option value="">Género</option>
  <option value="masculino">Masculino</option>
  <option value="femenino">Femenino</option>
  <option value="otro">Otro</option>
</select>

<input type="date" id="birthday">

<select id="role">
  <option value="staff">Staff</option>
  <option value="admin">Admin</option>
</select>

<button id="registerBtn">Registrar</button>
</div>

<script>
document.getElementById("registerBtn").onclick = async () => {

  const token = localStorage.getItem("token");

  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    age: parseInt(document.getElementById("age").value),
    gender: document.getElementById("gender").value,
    birthday: document.getElementById("birthday").value,
    role: document.getElementById("role").value
  };

  const res = await fetch("https://thefindoraprototipe.onrender.com/api/register_user", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(payload)
  });

  console.log("333")

  const data = await res.json();

  if (res.ok) {
    alert("Usuario registrado correctamente");
  } else {
    alert(data.error || "Error registrando");
  }
};
</script>

</body>
</html>
