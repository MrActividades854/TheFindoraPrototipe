<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestor de Perfiles</title>
  <link rel="shortcut icon" href="./../../src/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./profiles.css">
  <link rel="stylesheet" href="./../../global.css">
</head>
<body>
  
  <main>
  <h1>Gestor de Perfiles</h1>

  <button onclick="location.href='./createProfile/create_profile.html'">Crear nuevo perfil</button>
  

  <section class="profile-list">
    <h2>Perfiles guardados</h2>
    <div id="profilesContainer" class="profiles-grid">Cargando...</div>
  </section>

  </main>

<script type="module">
  import { CONFIG } from "../../js/config.js";

  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "./../../extrafindorasections/loginPage/login.html";
  }
  
  // Verificar si las miniaturas están habilitadas
  const showThumbnails = localStorage.getItem('showThumbnails') !== 'false';
  const thumbnailStyle = localStorage.getItem('thumbnailStyle') || 'grid';
  const thumbnailQuality = localStorage.getItem('thumbnailQuality') || 'medium';

  async function fetchProfileWithImages(profileId) {
    const res = await fetch(
  `https://thefindoraprototipe.onrender.com/api/profile/${profileId}`,
  {
    headers: {
      "Authorization": "Bearer " + token
    }
  }
);
    return await res.json();
  }

  async function fetchProfiles() {
    const res = await fetch(
      `https://thefindoraprototipe.onrender.com/api/profiles`
      , {
        headers: {
          "Authorization": "Bearer " + token
        }
      });
    const list = await res.json();
    console.log("Perfiles obtenidos:", list);

    const container = document.getElementById('profilesContainer');
    container.innerHTML = '';

    // Aplicar estilo de visualización
    if (thumbnailStyle === 'list') {
      container.classList.remove('profiles-grid');
      container.classList.add('profile-list-view');
      container.style.display = 'block';
    } else {
      container.classList.add('profiles-grid');
      container.classList.remove('profile-list-view');
      container.style.display = 'grid';
    }

    // Si las miniaturas están deshabilitadas, cargar solo datos básicos
    if (!showThumbnails) {
      renderProfilesWithoutThumbnails(list, container);
      return;
    }

    // Si las miniaturas están habilitadas, cargar imágenes
    const profilePromises = list.map(async (p) => {
      try {
        const fullProfile = await fetchProfileWithImages(p.id);
        return {
          ...p,
          references: fullProfile.references || []
        };
      } catch (error) {
        console.error(`Error cargando perfil ${p.id}:`, error);
        return {
          ...p,
          references: []
        };
      }
    });

    const profilesWithImages = await Promise.all(profilePromises);
    console.log("Perfiles con imágenes:", profilesWithImages);

    // Renderizar perfiles con miniaturas
    renderProfilesWithThumbnails(profilesWithImages, container);
  }

  function renderProfilesWithoutThumbnails(profiles, container) {
    profiles.forEach(p => {
      const card = document.createElement('div');
      card.className = 'profile-card no-thumbnail';
      card.style.padding = '15px';
      card.style.display = 'flex';
      card.style.alignItems = 'center';
      card.style.justifyContent = 'space-between';

      const info = document.createElement('div'); 
      info.className = 'info';
      info.style.flex = '1';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.name;
      name.style.fontSize = '16px';
      name.style.marginBottom = '5px';

      const age = document.createElement('div');
      age.className = 'age';
      age.textContent = `${p.age} años`;
      age.style.fontSize = '14px';
      age.style.opacity = '0.7';

      info.appendChild(name);
      info.appendChild(age);

      const arrow = document.createElement('div');
      arrow.innerHTML = '➔';
      arrow.style.fontSize = '20px';
      arrow.style.opacity = '0.5';
      arrow.style.marginLeft = '15px';

      card.appendChild(info);
      card.appendChild(arrow);

      card.onclick = () => {
        location.href = `profile_view.html?id=${p.id}`;
      };

      container.appendChild(card);
    });
  }

  function renderProfilesWithThumbnails(profiles, container) {
    profiles.forEach(p => {
      const card = document.createElement('div');
      card.className = 'profile-card';

      const imgSrc = p.references && p.references.length > 0 
        ? p.references[0].file_path 
        : './../../src/profile.png'; 

      console.log("Perfil", p.id, "tiene", p.references?.length || 0, "referencias");
      console.log("Usando imagen:", imgSrc);

      const img = document.createElement('img');
      img.src = imgSrc;
      img.alt = p.name;
      img.loading = 'lazy';
      
      // Aplicar calidad de imagen
      if (thumbnailQuality === 'low') {
        img.style.filter = 'blur(0.5px)';
        img.style.opacity = '0.9';
      } else if (thumbnailQuality === 'high') {
        img.style.filter = 'none';
      }
      
      // Manejar errores de carga de imagen
      img.onerror = function() {
        console.log("Error cargando imagen, usando por defecto");
        this.src = './../../src/profile.png';
      };

      const info = document.createElement('div'); 
      info.className = 'info';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.name;

      const age = document.createElement('div');
      age.className = 'age';
      age.textContent = `${p.age} años`;

      // Mostrar cantidad de imágenes (opcional)
      const imageCount = document.createElement('div');
      imageCount.className = 'age';
      const refCount = p.references ? p.references.length : 0;
      imageCount.textContent = `${refCount} imagen${refCount !== 1 ? 'es' : ''}`;
      imageCount.style.opacity = '0.6';
      imageCount.style.fontSize = '12px';

      info.appendChild(name);
      info.appendChild(age);
      info.appendChild(imageCount);

      card.appendChild(img);
      card.appendChild(info);

      card.onclick = () => {
        location.href = `profile_view.html?id=${p.id}`;
      };

      container.appendChild(card);
    });
  }

  fetchProfiles();
</script>

<script type="module">
import { initBackgroundDetection } from '../../js/background-init.js';

function initBG() {
    const allowWS = localStorage.getItem("useWebSocket") === "true";

    if (!allowWS) {
        console.log("[BG] WebSocket desactivado → solo modo local. No iniciar background.");
        return;
    }

    initBackgroundDetection();
}

initBG();
</script>

  <script type="module" src="./../../js/headerLoader.js"></script>
</body>
</html>
