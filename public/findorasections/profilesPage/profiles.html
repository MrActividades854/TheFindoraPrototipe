<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestor de Perfiles</title>
  <style>

* {
      margin: 0;
      padding: 0;
    }

    body {
      background:  linear-gradient(90deg,rgb(135, 199, 231), rgb(196, 218, 237));
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    main {
      padding: 20px;
    }
    h1 { margin-top: 0; }
    .profile-list, .profile-view, .new-profile-form {
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
    .profile-item {
      padding: 10px;
      background: #1f2937;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    label { display: block; margin-top: 10px; }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #238636;
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }
    button:hover { background: #2ea043; }
    img.ref-preview {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  
  <main>
  <h1>Gestor de Perfiles</h1>

  <button onclick="location.href='../../index.html'">Volver</button>
  <button onclick="location.href='./createProfile/create_profile.html'">Crear nuevo perfil</button>
  

  <section class="profile-list">
    <h2>Perfiles guardados</h2>
    <div id="profilesContainer">Cargando...</div>
  </section>

  </main>

  <script type="module">
    import { CONFIG } from "../../js/config.js";
    async function fetchProfiles() {
      const res = await fetch(`https://thefindoraprototipe.onrender.com/api/profiles`);
      const list = await res.json();

      const container = document.getElementById('profilesContainer');
      container.innerHTML = '';

      list.forEach(p => {
        const div = document.createElement('div');
        div.className = 'profile-item';
        div.textContent = `${p.name} — ${p.age} años`;
        div.onclick = () => location.href = `profile_view.html?id=${p.id}`;
        container.appendChild(div);
      });
    }

    fetchProfiles();
  </script>

<script type="module">
import { initBackgroundDetection } from '../../js/background-init.js';

function initBG() {
    const allowWS = localStorage.getItem("useWebSocket") === "true";

    if (!allowWS) {
        console.log("[BG] WebSocket desactivado → solo modo local. No iniciar background.");
        return;
    }

    initBackgroundDetection();
}

initBG();
</script>

  <script type="module" src="./../../js/headerLoader.js"></script>
</body>
</html>
