<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./create_profile.css">
    <link rel="stylesheet" href="./../../../global.css">
</head>
<body>
    <main>
      <button onclick="location.href='./../profiles.html'">Volver</button>
        <section class="new-profile-form">
            <h2>Crear nuevo perfil</h2>
            <label>Nombre:
              <input type="text" id="nameInput" />
            </label>
        
            <label>Edad:
              <input type="number" id="ageInput" />
            </label>

            <label>
              Género:
              <select id="genderInput">
                <option value="">Selecciona un Género</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
              </select>
            </label>

            <label>Estatus:
              <select id="statusInput">
                <option value="">Selecciona un Status</option>
                <option value="estudiante">Estudiante</option>
                <option value="profesor">Profesor</option>
                <option value="personal">Personal</option>
              </select>
            </label>

            <label>Cumpleaños:
              <input type="date" id="birthdayInput" />
            </label>
        
            <label>Imágenes de referencia (1 a 5):
              <input type="file" id="refFiles" accept="image/*" multiple />
            </label>
        
            <button id="saveProfileBtn">Guardar Perfil</button>
            <button onclick="history.back()">Cancelar</button>
          </section>
          <hr>

          <h3>Subir perfiles masivamente</h3>

          <input type="file" id="excelInput" accept=".xlsx, .csv" />
          <button id="uploadExcelBtn">Subir Excel</button>
    </main>
    <script type="module">
      import { CONFIG } from './../../../js/config.js';
      document.getElementById('saveProfileBtn').onclick = async () => {
        const name = document.getElementById('nameInput').value.trim();
        const age = parseInt(document.getElementById('ageInput').value.trim());
        const gender = document.getElementById('genderInput').value;
        const status = document.getElementById('statusInput').value;
        const birthday = document.getElementById('birthdayInput').value;
        const files = document.getElementById('refFiles').files;

        if (!name || !age || !gender || !status || !birthday || files.length === 0) {
            alert('Completa todos los campos y agrega entre 1 y 5 imágenes.');
            return;
        }

      const form = new FormData();
      form.append('name', name);
      form.append('age', age);
      form.append('gender', gender);
      form.append('status', status);
      form.append('birthday', birthday);
      for (let f of files) form.append('refs', f);

      const res = await fetch(`https://thefindoraprototipe.onrender.com/api/new_profile`, {
        method: 'POST',
        body: form
      });

      if (res.ok) {
        alert('Perfil guardado correctamente');
        localStorage.removeItem(CONFIG.PROFILES_KEY);
        fetchProfiles();
        location.href = './../profiles.html';
      } else {
        alert('Error guardando perfil');
      }
    };
    </script>
    <script type="module">
import { initBackgroundDetection } from '../../js/background-init.js';

function initBG() {
    const allowWS = localStorage.getItem("useWebSocket") === "true";

    if (!allowWS) {
        console.log("[BG] WebSocket desactivado → solo modo local. No iniciar background.");
        return;
    }

    initBackgroundDetection();
}

initBG();
</script>
<script type="module" src="./../../../js/headerLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</body>
</html>
