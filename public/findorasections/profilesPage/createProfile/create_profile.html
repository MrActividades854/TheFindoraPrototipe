<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    margin: 0;
    }
    </style>
</head>
<body>
    <main>
        <section class="new-profile-form">
            <h2>Crear nuevo perfil</h2>
            <label>Nombre:
              <input type="text" id="nameInput" />
            </label>
        
            <label>Edad:
              <input type="number" id="ageInput" />
            </label>
        
            <label>Imágenes de referencia (1 a 5):
              <input type="file" id="refFiles" accept="image/*" multiple />
            </label>
        
            <button id="saveProfileBtn">Guardar Perfil</button>
            <button onclick="history.back()">Cancelar</button>
          </section>
    </main>
    <script type="module">
        document.getElementById('saveProfileBtn').onclick = async () => {
        const name = document.getElementById('nameInput').value.trim();
        const age = parseInt(document.getElementById('ageInput').value.trim());
        const files = document.getElementById('refFiles').files;

        if (!name || !age || files.length === 0) {
            alert('Completa todos los campos y agrega entre 1 y 5 imágenes.');
            return;
        }

      const form = new FormData();
      form.append('name', name);
      form.append('age', age);
      for (let f of files) form.append('refs', f);

      const res = await fetch(`https://thefindoraprototipe.onrender.com/api/new_profile`, {
        method: 'POST',
        body: form
      });

      if (res.ok) {
        alert('Perfil guardado correctamente');
        fetchProfiles();
      } else {
        alert('Error guardando perfil');
      }
    };
    </script>
    <script type="module" src="./../../../js/headerLoader.js"></script>
</body>
</html>
