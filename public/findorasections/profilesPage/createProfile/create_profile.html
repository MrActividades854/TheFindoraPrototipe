<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
      margin: 0;
      padding: 0;
      }

      body {
      background:  linear-gradient(90deg,rgb(135, 199, 231), rgb(196, 218, 237));
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      }

      main {
      padding: 20px;
      }
      h1 { margin-top: 0; }
      .profile-list, .profile-view, .new-profile-form {
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      }
      .profile-item {
      padding: 10px;
      background: #22395a;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    label { display: block; margin-top: 10px; }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #238636;
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }
    </style>
</head>
<body>
    <main>
      <button onclick="location.href='./../profiles.html'">Volver</button>
        <section class="new-profile-form">
            <h2>Crear nuevo perfil</h2>
            <label>Nombre:
              <input type="text" id="nameInput" />
            </label>
        
            <label>Edad:
              <input type="number" id="ageInput" />
            </label>
        
            <label>Imágenes de referencia (1 a 5):
              <input type="file" id="refFiles" accept="image/*" multiple />
            </label>
        
            <button id="saveProfileBtn">Guardar Perfil</button>
            <button onclick="history.back()">Cancelar</button>
          </section>
    </main>
    <script type="module">
        document.getElementById('saveProfileBtn').onclick = async () => {
        const name = document.getElementById('nameInput').value.trim();
        const age = parseInt(document.getElementById('ageInput').value.trim());
        const files = document.getElementById('refFiles').files;

        if (!name || !age || files.length === 0) {
            alert('Completa todos los campos y agrega entre 1 y 5 imágenes.');
            return;
        }

      const form = new FormData();
      form.append('name', name);
      form.append('age', age);
      for (let f of files) form.append('refs', f);

      const res = await fetch(`https://thefindoraprototipe.onrender.com/api/new_profile`, {
        method: 'POST',
        body: form
      });

      if (res.ok) {
        alert('Perfil guardado correctamente');
        fetchProfiles();
      } else {
        alert('Error guardando perfil');
      }
    };
    </script>
    <script type="module">
import { initBackgroundDetection } from '../../js/background-init.js';

function initBG() {
    const allowWS = localStorage.getItem("useWebSocket") === "true";

    if (!allowWS) {
        console.log("[BG] WebSocket desactivado → solo modo local. No iniciar background.");
        return;
    }

    initBackgroundDetection();
}

initBG();
</script>
    <script type="module" src="./../../../js/headerLoader.js"></script>
</body>
</html>
