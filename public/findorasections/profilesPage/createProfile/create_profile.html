<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./create_profile.css">
    <link rel="stylesheet" href="./../../../global.css">
</head>
<body>
    <main>
      <button onclick="location.href='./../profiles.html'">Volver</button>
      <section class="new-profile-form">
            <h2>Crear nuevo perfil</h2>
            <label>Nombre:
              <input type="text" id="nameInput" />
            </label>
        
            <label>Edad:
              <input type="number" id="ageInput" />
            </label>

            <label>Género:
              <select id="genderInput">
                <option value="">Selecciona un Género</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
              </select>
            </label>

            <label>Estatus:
              <select id="statusInput">
                <option value="">Selecciona un Status</option>
                <option value="estudiante">Estudiante</option>
                <option value="profesor">Profesor</option>
                <option value="personal">Personal</option>
              </select>
            </label>

            <label id="gradeLabel" style="display:none;">Grado:
              <select id="gradeInput">
                <option value="">Selecciona un grado</option>
                <option value="11A">11A</option>
                <option value="11B">11B</option>
                <option value="10A">10A</option>
                <option value="10B">10B</option>
              </select>
            </label>

            <label>Cumpleaños:
              <input type="date" id="birthdayInput" />
            </label>
        
            <label>Imágenes de referencia (1 a 5):
              <input type="file" id="refFiles" accept="image/*" multiple />
            </label>
        
            <button id="saveProfileBtn">Guardar Perfil</button>
            <button onclick="history.back()">Cancelar</button>
      </section>
      <hr>

          <h3>Subir perfiles masivamente</h3>

          <input type="file" id="excelInput" accept=".xlsx, .csv" />
          <button id="uploadExcelBtn">Subir Excel</button>
    </main>
    <script type="module" src="./create_profile.js"></script>
    <script type="module">
import { initBackgroundDetection } from '../../js/background-init.js';

function initBG() {
    const allowWS = localStorage.getItem("useWebSocket") === "true";

    if (!allowWS) {
        console.log("[BG] WebSocket desactivado → solo modo local. No iniciar background.");
        return;
    }

    initBackgroundDetection();
}

initBG();
</script>
<script type="module" src="./../../../js/headerLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</body>
</html>
