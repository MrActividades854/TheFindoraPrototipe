<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Perfil</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background:  linear-gradient(90deg,rgb(135, 199, 231), rgb(196, 218, 237));
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: auto;
    }
    .card {
      background: #22395a;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
    h1, h2 { margin-top: 0; }
    .refs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    .refs img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #30363d;
    }
    #editSection input,
#editSection select {
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 6px;
  margin-top: 4px;
}

    button {
      background: #238636;
      border: none;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }
    button:hover { background: #2ea043; }
    .danger { background: #da3633; }
    .danger:hover { background: #f85149; }
    #editSection label { display:block; margin-top:10px; }
    #editSection input { width:100%; padding:8px; border:none; border-radius:6px; margin-top:4px; }
  </style>
</head>
<body>
  <div class="container">
    <button onclick="location.href='profiles.html'">Volver</button>

    <div class="card" id="profileCard">
      <h1 id="name"></h1>
      <h2 id="age"></h2>
      <p id="gender"></p>
      <p id="schoolstatus"></p>
      <p id="birthday"></p>


      <button id="editBtn">Editar</button>

      <div id="editSection" style="display:none; margin-top:20px;">
        <label>Nombre:
          <input type="text" id="editName">
        </label>

        <label>Edad:
          <input type="number" id="editAge">
        </label>

        <label>Género:
  <select id="editGender">
    <option value="">Selecciona un Género</option>
    <option value="masculino">Masculino</option>
    <option value="femenino">Femenino</option>
    <option value="otro">Otro</option>
  </select>
</label>

<label>Estatus:
  <select id="editStatus">
    <option value="">Selecciona un Status</option>
    <option value="estudiante">Estudiante</option>
    <option value="profesor">Profesor</option>
    <option value="personal">Personal</option>
  </select>
</label>
        
        <label>Fecha de nacimiento:
          <input type="date" id="editBirthday">
        </label>

        <button id="saveChangesBtn">Guardar Cambios</button>
      </div>

      <h3>Imágenes de referencia:</h3>
      <div class="refs" id="refs"></div>

      <button id="addImageBtn">➕ Agregar imágenes</button>
      <input type="file" id="addImageInput" accept="image/*" multiple style="display:none;">

      <button class="danger" id="deleteBtn">Eliminar Perfil</button>
    </div>
  </div>

  <script type="module">
    import { CONFIG } from "../../js/config.js";
    const urlParams = new URLSearchParams(window.location.search);
    const profileId = urlParams.get('id');

    let ProfileData = null;

    let IsEditing = false;

    async function loadProfile() {
      const res = await fetch(`https://thefindoraprototipe.onrender.com/api/profile/${profileId}`);
      const data = await res.json();

      document.getElementById('name').textContent = data.name;
      document.getElementById('age').textContent = data.age + ' años';
      document.getElementById('gender').textContent = data.gender ? `${data.gender}`: '';
      document.getElementById('schoolstatus').textContent = data.status ? `Estatus: ${data.status}` : '';
      document.getElementById('birthday').textContent = data.birthday ? `Cumpleaños: ${data.birthday.split('T')[0]}` : '';

      const refsContainer = document.getElementById('refs');
      refsContainer.innerHTML = '';

      data.references.forEach(r => {
        const img = document.createElement('img');
        img.src = r.file_path;
        refsContainer.appendChild(img);
      });

      ProfileData = data;
    }

    // MODO EDICIÓN
document.getElementById("editBtn").onclick = () => {

  if (IsEditing) {
    document.getElementById("editBtn").textContent = "Editar";
    document.getElementById("editSection").style.display = "none";
    IsEditing = false;
    return;
  } else {
    document.getElementById("editBtn").textContent = "Cancelar";
    IsEditing = true;
  }

  document.getElementById("editSection").style.display = "block";

  document.getElementById("editName").value = ProfileData.name;
  document.getElementById("editAge").value = ProfileData.age;
  document.getElementById("editGender").value = ProfileData.gender || "";
  document.getElementById("editStatus").value = ProfileData.status || "";
  document.getElementById("editBirthday").value =
    ProfileData.birthday ? ProfileData.birthday.split("T")[0] : "";
};


    // GUARDAR CAMBIOS
    document.getElementById("saveChangesBtn").onclick = async () => {
const payload = {
  name: document.getElementById("editName").value.trim(),
  age: parseInt(document.getElementById("editAge").value, 10),
  gender: document.getElementById("editGender").value,
  status: document.getElementById("editStatus").value,
  birthday: document.getElementById("editBirthday").value || null
};

      const res = await fetch(`https://thefindoraprototipe.onrender.com/api/edit_profile/${profileId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert("Perfil actualizado.");
        location.reload();
      } else {
        alert("Error guardando cambios.");
      }
    };

    // AGREGAR IMÁGENES
    document.getElementById("addImageBtn").onclick = () =>
      document.getElementById("addImageInput").click();

    document.getElementById("addImageInput").onchange = async (e) => {
      const files = e.target.files;
      if (files.length === 0) return;

      const form = new FormData();
      for (let f of files) form.append("refs", f);

      const res = await fetch(`https://thefindoraprototipe.onrender.com/api/add_images/${profileId}`, {
        method: "POST",
        body: form
      });

      if (res.ok) {
        alert("Imágenes añadidas.");
        loadProfile();
      } else {
        alert("Error agregando imágenes.");
      }
    };

    document.getElementById('deleteBtn').onclick = async () => {
      if (!confirm('¿Eliminar este perfil permanentemente?')) return;

      const res = await fetch(`https://thefindoraprototipe.onrender.com/api/delete_profile/${profileId}`, {
        method: 'DELETE'
      });

      if (res.ok) {
        alert('Perfil eliminado');
        localStorage.removeItem(CONFIG.PROFILES_KEY);
        location.href = 'profiles.html';
      } else {
        alert('Error eliminando el perfil');
      }
    };

    loadProfile();
  </script>
  <script type="module">
import { initBackgroundDetection } from '../../js/background-init.js';

function initBG() {
    const allowWS = localStorage.getItem("useWebSocket") === "true";

    if (!allowWS) {
        console.log("[BG] WebSocket desactivado → solo modo local. No iniciar background.");
        return;
    }

    initBackgroundDetection();
}

initBG();
</script>
  <script type="module" src="./../../js/headerLoader.js"></script>
</body>
</html>
