<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Registro de Notificaciones</title>
<style>
  * {
    margin: 0;
  }

  body {
    background:  linear-gradient(90deg,rgb(135, 199, 231), rgb(196, 218, 237));
    color: #e6edf3;
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    overflow: hidden;
  }

.principal {
    margin-top: 15px;
    width: 100%;
    display: flex;
    align-items: left;
    justify-content: left;
  }

  button {
    background-color: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-left: 20px;
  }

  h1 {
    margin-top: 10px;
    font-weight: bold;
    font-size: 1.8rem;
    margin-left: 27%;
  }

  #logContainer {
    background: rgb(49, 49, 161);
    border-radius: 12px;
    height: 70vh;
    width: 80%;
    overflow-y: auto;
    scroll-behavior: smooth;
    margin: 20px auto;
    padding: 20px;
    border: 10px solid rgb(49, 49, 161);
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background: rgb(80, 80, 180);
    border-left: 5px solid #4caf50;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s ease;
    animation: fadeInUp 0.4s forwards;
  }

  li.warning {
    border-left-color: #ff4d4d;
  }

  li.success {
    border-left-color: #4caf50;
  }

  .message {
    font-size: 15px;
  }

  .time {
    font-size: 13px;
    opacity: 0.7;
    text-align: right;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .clear-btn {
    background: #238636;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s ease;
  }

  .clear-btn:hover {
    background: #2ea043;
  }

</style>
</head>
<body>

    <div class="principal">

  <button onclick="localStorage.removeItem('findora_notifications'); location.reload();">
Borrar historial
</button>
      <h1>Historial</h1>
    </div>
  <div id="logContainer">
    <ul id="logList"></ul>
  </div>
<script>
function clearHistory() {
  localStorage.removeItem('findora_notifications');
  location.reload();
}

function loadNotifications() {
    const list = JSON.parse(localStorage.getItem("findora_notifications") || "[]");
    const container = document.getElementById("logList");   // ← corregido

    if (!container) return;

    container.innerHTML = "";

    list.reverse().forEach(n => {
        const li = document.createElement("li");
        li.className = n.type === "warning" ? "warning" : "success";
        li.innerHTML = `
            <div class="message">${n.message}</div>
            <div class="time">${new Date(n.time).toLocaleString()}</div>
        `;
        container.appendChild(li);
    });
}

window.onload = function() {
    loadNotifications();
    // Escuchar cambios en localStorage para actualizar en tiempo real
    const storageHandler = (e) => {
    if (e.key === 'findora_notifications') {
        loadNotifications();
    }
};

window.addEventListener('storage', storageHandler);
window.addEventListener('beforeunload', () => {
    window.removeEventListener('storage', storageHandler);
});
};

  window.addEventListener('storage', (e) => {
    if (e.key === 'findora_notifications') {
      loadNotifications();
    }
  });
</script>

<script type="module">
    import { initBackgroundDetection } from '../../js/background-init.js';
    function start() {
        const allowWS = localStorage.getItem("useWebSocket") === "true";

        if (!allowWS) {
            console.log("[BG] WebSocket desactivado → solo modo local. No iniciar background.");
            return;
        }

        initBackgroundDetection();
    }
    start();
  </script>
<script type="module" src="./../../js/headerLoader.js"></script>


</body>
</html>
