<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Registro de Notificaciones</title>
<style>
  * {
    margin: 0;
  }

  body {
    background:  linear-gradient(90deg,rgb(135, 199, 231), rgb(196, 218, 237));
    color: #e6edf3;
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0;
    overflow: hidden;
  }

  header {
    background-color: blue;
}

header nav {
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 10px;
}

nav a {
    text-decoration: none;
    color: white;
    font-weight: bold;
    font-size: 20px;
    font-family: Arial, Helvetica, sans-serif;
    padding: 10px;
    border-radius: 10px;
}

nav a:hover {
    background-color: aqua;
}

nav img {
    height: 50px;
    width: 50px;
    border-radius: 50%;
}

.bell {
    margin-left: 55%;
}

.perfil {
    transform: scale(200%);
    border-radius: 10px;
    border: none;
}

.principal {
    margin-top: 15px;
    width: 100%;
    display: flex;
    align-items: left;
    justify-content: left;
  }

  button {
    background-color: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-left: 20px;
  }

  h1 {
    margin-top: 10px;
    font-weight: bold;
    font-size: 1.8rem;
    margin-left: 27%;
  }

  #logContainer {
    background: #161b22;
    border-radius: 12px;
    height: 70vh;
    width: 80%;
    overflow-y: auto;
    scroll-behavior: smooth;
    margin: 20px auto;
    border-top: 10px solid #238636;
    border-left: 20px solid #238636;
    border-right: 20px solid #238636;
    border-bottom: 10px solid #238636;
    box-shadow: inset 0 0 0 10px #238636;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background: #1c2128;
    border-left: 5px solid #4caf50;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s ease;
    animation: fadeInUp 0.4s forwards;
  }

  li.warning {
    border-left-color: #ff4d4d;
  }

  li.success {
    border-left-color: #4caf50;
  }

  .message {
    font-size: 15px;
  }

  .time {
    font-size: 13px;
    opacity: 0.7;
    text-align: right;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .clear-btn {
    background: #238636;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s ease;
  }

  .clear-btn:hover {
    background: #2ea043;
  }

</style>
</head>
<body>


    <div class="principal">
  
  <button class="clear-btn" 
        onclick="location.href='../../index.html'" 
        style="background:#2563eb; margin-left:10px;">
  ⬅️ Regresar
</button>

  <button onclick="localStorage.removeItem('findora_notifications'); location.reload();">
🗑️ Borrar historial
</button>
      <h1>Historial</h1>
    </div>
  <div id="logContainer">
    <ul id="logList"></ul>
  </div>
  <div id="historyContainer"></div>
<script>
function loadNotifications() {
    const list = JSON.parse(localStorage.getItem("findora_notifications") || "[]");
    const container = document.getElementById("logList");   // ← corregido

    if (!container) return;

    container.innerHTML = "";

    list.forEach(n => {
        const li = document.createElement("li");
        li.className = n.type === "warning" ? "warning" : "success";
        li.innerHTML = `
            <div class="message">${n.message}</div>
            <div class="time">${new Date(n.time).toLocaleString()}</div>
        `;
        container.appendChild(li);
    });
}

window.onload = function() {
    loadNotifications();
    // Escuchar cambios en localStorage para actualizar en tiempo real
    const storageHandler = (e) => {
    if (e.key === 'findora_notifications') {
        loadNotifications();
    }
};

window.addEventListener('storage', storageHandler);
window.addEventListener('beforeunload', () => {
    window.removeEventListener('storage', storageHandler);
});
};
</script>

<script type="module">
    import { initBackgroundDetection } from '../../js/background-init.js';
    function start() {
        const allowWS = localStorage.getItem("useWebSocket") === "true";

        if (!allowWS) {
            console.log("[BG] WebSocket desactivado → solo modo local. No iniciar background.");
            return;
        }

        initBackgroundDetection();
    }
    start();
  </script>
  <script type="module">
import { CONFIG } from "/js/config.js";
import NotificationManager from "/public/js/notifications.js";

// Solo historial, sin pop-ups
const notifier = new NotificationManager(`${CONFIG.API_BASE}/api/notifications`, "history");

// Mostrar historial
const list = JSON.parse(localStorage.getItem("findora_notifications") || "[]").reverse();
const container = document.getElementById("historyContainer");

list.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `
        <div class="message">${item.message}</div>
        <div class="time">${new Date(item.time).toLocaleString()}</div>
    `;
    container.appendChild(div);
});
</script>


</body>
</html>
