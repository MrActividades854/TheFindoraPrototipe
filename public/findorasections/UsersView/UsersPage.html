<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestor de Usuarios</title>

<link rel="shortcut icon" href="./../../src/favicon.ico" type="image/x-icon">

<style>

* {
    margin: 0;
    padding: 0;
}



.users-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.user-card{
background:#22395a;
color:white;
padding:15px;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}

.user-card:hover{
transform:scale(1.02);
}

.role{
font-size:12px;
opacity:0.7;
}

.admin{
color:#ffcc66;
}

.staff{
color:#8fd3ff;
}
</style>

<link rel="stylesheet" href="./../../global.css">

</head>

<body>

<main>

<h1>Gestor de Usuarios</h1>

<button onclick="location.href='./registrationPage/register_user.html'">
Registrar Usuario
</button>

<section>

<h2>Usuarios registrados</h2>

<div id="usersContainer" class="users-grid">
Cargando...
</div>

</section>

</main>

<script type="module">

const token = localStorage.getItem("token");

if (!token){
window.location.href="./../../extrafindorasections/loginPage/login.html";
}

async function fetchUsers(){

const res = await fetch(
"https://thefindoraprototipe.onrender.com/api/users",
{
headers:{
"Authorization":"Bearer "+token
}
});

const list = await res.json();

const container = document.getElementById("usersContainer");
container.innerHTML="";

list.forEach(user=>{

const card=document.createElement("div");
card.className="user-card";

const name=document.createElement("div");
name.textContent=user.name;

const email=document.createElement("div");
email.textContent=user.email;

const role=document.createElement("div");
role.className="role "+user.role;
role.textContent=user.role;

const reg=document.createElement("div");
reg.className="role";
reg.textContent="Registrado: "+new Date(user.registration_date).toLocaleDateString();

card.appendChild(name);
card.appendChild(email);
card.appendChild(role);
card.appendChild(reg);

card.onclick=()=>{
location.href=`user_view.html?id=${user.id}`;
};

container.appendChild(card);

});

}

fetchUsers();

</script>
<script type="module" src="./../../js/headerLoader.js"></script>
</body>
</html>
