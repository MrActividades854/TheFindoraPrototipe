<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="camara.css">
    <link rel="shortcut icon" href="../../src/favicon.ico" type="image/x-icon">
    <title>Cámara - Findora</title>
</head>
<body>
    <div class="main">
        <!-- Botón anterior -->
        <div class="anterior" id="prevBtn">
            <div class="flechaI"></div>
        </div>
        
        <!-- Contenedor de cámara -->
        <div class="camara" id="cameraContainer">
            <h3 id="cameraTitle">Cámara #1</h3>
            
            <!-- Contenedor de video + canvas -->
            <div class="video-wrapper">
                <video id="bigFeed" autoplay playsinline muted></video>
                <canvas id="detectionCanvas"></canvas>
            </div>
            
            <!-- Indicador de estado -->
            <div class="status-overlay" id="statusOverlay">
                <div class="spinner"></div>
                <p id="statusText">Conectando...</p>
            </div>

            <!-- Panel de detecciones -->
            <div class="detection-panel" id="detectionPanel">
                <div class="panel-header">
                    <span>👤 Personas Detectadas</span>
                    <button id="togglePanelBtn">−</button>
                </div>
                <div class="panel-content" id="panelContent">
                    <p class="no-detections">Sin detecciones</p>
                </div>
            </div>
        </div>
        
        <!-- Botón siguiente -->
        <div class="siguiente" id="nextBtn">
            <div class="flechaD"></div>
        </div>
    </div>

    <script type="module" src="./camara.js"></script>

    <!-- Header -->
    <script type="module" src="./../../js/headerLoader.js"></script>
</body>
</html>
