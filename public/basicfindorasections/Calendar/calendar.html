<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario</title>
<link rel="stylesheet" href="./../../global.css">

<style>
body {
  background:#0d1117;
  color:white;
  font-family: Arial;
  text-align:center;
}

.calendar {
  margin:40px auto;
  width:300px;
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  gap:5px;
}

.day {
  padding:15px;
  background:#22395a;
  border-radius:6px;
}

.today {
  background:#2ecc71;
}
</style>
</head>

<body>

<h1>Calendario</h1>

<div class="calendar" id="calendar"></div>

<script>
const calendar = document.getElementById("calendar");
const today = new Date().getDate();

for (let i = 1; i <= 30; i++) {
  const day = document.createElement("div");
  day.className = "day";
  day.textContent = i;

  if (i === today) {
    day.classList.add("today");
  }

  calendar.appendChild(day);
}
</script>

</body>
</html>
