<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="./../../global.css">
<style>
body {
  font-family: Arial;
  background: linear-gradient(90deg,rgb(135,199,231),rgb(196,218,237));
}
.card {
  margin: 100px auto;
  background:#22395a;
  padding:30px;
  border-radius:12px;
  width:300px;
  color:white;
}
input {
  width:100%;
  padding:8px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}
button {
  width:100%;
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#238636;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>
  <header>
    <style>
        header {
            background-color: rgb(49, 49, 174);
            width: 100%;
        }

        header nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        header nav > div:first-child {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .hoverable:hover {
            background-color: aqua;
        }

        nav img {
            width: 40px;
            height: 40px;
        }

        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 20px;
            height: 60px;
        }

        .bell {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .perfil {
            width: 50px;
            height: 50px;
            border-radius: 10px;
        }

        .logo {
            width: 60px;
            height: 60px;
        }

        .login-options {
            height: 60px;
            background-color: rgb(49, 49, 113);
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 20px;
            padding: 5px 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-options:hover {
            background-color: rgb(60, 60, 140);
        }

        #log-in {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        .login-dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            position: absolute;
            top: 70px;
            right: 0;
            background-color: rgb(49, 49, 113);
            border-radius: 10px;
            min-width: 150px;
            display: none;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: dropdown 0.2s ease-out;
            z-index: 9999;
        }

        .dropdown-menu a {
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .dropdown-menu a:hover {
            background-color: rgb(60, 60, 180);
        }

        @keyframes dropdown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff3b30;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            min-width: 18px;
            text-align: center;
        }

        .notification-link {
            position: relative;
        }

        input {
  width: 100%;
  padding: 8px;
  margin-top: 10px;
  border: none;
  border-radius: 6px;
  background-color: #1b2b45; /* fondo oscuro */
  color: white; /* 👈 texto visible */
}
    </style>

    <nav>
        <div>
            <img src="./../../src/Logo.png" class="logo" alt="Logo">

            <a class="hoverable" data-page="mainPage">Inicio</a>
        </div>

        <div class="login-dropdown">
            <div class="login-options">
                <span id="log-in">Iniciar Sesión</span>
            </div>
        </div>
    </nav>
</header>
<div class="card">
<h2>Iniciar Sesión</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Contraseña">

<button id="loginBtn">Entrar</button>
</div>

<script>
document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("https://thefindoraprototipe.onrender.com/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (res.ok) {
    localStorage.setItem("token", data.token);

    // Decodificar token para saber rol
    const payload = JSON.parse(atob(data.token.split('.')[1]));

    if (payload.role === "admin") {
      window.location.href = "./../../findorasections/mainPage/Page.html";
    } else {
      window.location.href = "profiles.html";
    }

  } else {
    alert(data.error || "Error al iniciar sesión");
  }
};
</script>
</body>
</html>
