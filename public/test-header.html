<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Header - Findora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, rgb(135, 199, 231), rgb(196, 218, 237));
            min-height: 100vh;
        }

        .test-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #3131ae;
            margin-bottom: 20px;
        }

        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-family: monospace;
        }

        .status.loading {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .status.success {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }

        .status.error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }

        #console-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 20px;
        }

        .console-line {
            margin: 3px 0;
        }

        .console-line.error {
            color: #f48771;
        }

        .console-line.success {
            color: #89d185;
        }

        .console-line.warning {
            color: #e5c07b;
        }

        .console-line.info {
            color: #61afef;
        }

        button {
            background: #3131ae;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        button:hover {
            background: #2525a0;
        }

        .header-loading {
            background: #3131ae;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- El header se insertará aquí -->
    <div class="header-loading">⏳ Cargando header...</div>

    <div class="test-container">
        <h1>🧪 Prueba de Carga del Header</h1>

        <div id="status" class="status loading">
            ⏳ Esperando carga del header...
        </div>

        <div>
            <button onclick="testHeader()">🔄 Re-intentar Cargar Header</button>
            <button onclick="clearConsole()">🗑️ Limpiar Consola</button>
            <button onclick="checkHeaderInDOM()">🔍 Verificar Header en DOM</button>
        </div>

        <h3 style="margin-top: 25px;">📊 Consola de Debug:</h3>
        <div id="console-output"></div>
    </div>

    <script type="module">
        // Capturar todos los console.log para mostrarlos en la página
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const consoleOutput = document.getElementById('console-output');
        
        function addToConsole(message, type = 'info') {
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'info');
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole('ERROR: ' + args.join(' '), 'error');
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addToConsole('WARN: ' + args.join(' '), 'warning');
        };

        // Detectar si el header se cargó
        let checkInterval = setInterval(() => {
            const header = document.querySelector('header');
            const status = document.getElementById('status');
            
            if (header && !header.classList.contains('header-loading')) {
                clearInterval(checkInterval);
                status.className = 'status success';
                status.innerHTML = '✅ <strong>Header cargado exitosamente!</strong><br>Revisa la parte superior de la página.';
                addToConsole('✅ Header detectado en el DOM', 'success');
                
                // Verificar elementos
                const nav = header.querySelector('nav');
                const links = header.querySelectorAll('a');
                addToConsole(`   - Nav encontrado: ${nav ? 'SÍ' : 'NO'}`, 'info');
                addToConsole(`   - Enlaces encontrados: ${links.length}`, 'info');
            }
        }, 500);

        // Timeout de 10 segundos
        setTimeout(() => {
            clearInterval(checkInterval);
            const header = document.querySelector('header');
            if (!header || header.classList.contains('header-loading')) {
                const status = document.getElementById('status');
                status.className = 'status error';
                status.innerHTML = '❌ <strong>Header no se cargó</strong><br>Revisa la consola de debug abajo.';
                addToConsole('❌ TIMEOUT: Header no se cargó en 10 segundos', 'error');
            }
        }, 10000);

        // Funciones de testing
        window.testHeader = async function() {
            addToConsole('🔄 Recargando página...', 'info');
            location.reload();
        };

        window.clearConsole = function() {
            consoleOutput.innerHTML = '';
            addToConsole('Consola limpiada', 'info');
        };

        window.checkHeaderInDOM = function() {
            const header = document.querySelector('header');
            const loading = document.querySelector('.header-loading');
            
            addToConsole('🔍 Verificación del DOM:', 'info');
            addToConsole(`   - Header existe: ${header ? 'SÍ' : 'NO'}`, header ? 'success' : 'error');
            addToConsole(`   - Loading placeholder: ${loading ? 'SÍ' : 'NO'}`, 'info');
            
            if (header) {
                const nav = header.querySelector('nav');
                const links = header.querySelectorAll('a');
                const images = header.querySelectorAll('img');
                
                addToConsole(`   - Nav: ${nav ? 'SÍ' : 'NO'}`, nav ? 'success' : 'error');
                addToConsole(`   - Enlaces: ${links.length}`, 'info');
                addToConsole(`   - Imágenes: ${images.length}`, 'info');
            }
        };

        // Importar y cargar header
        console.log('🚀 Iniciando importación de header-loader...');
        
        import('./js/headerLoader.js')
            .then(() => {
                console.log('✅ header-loader.js importado correctamente');
            })
            .catch(error => {
                console.error('❌ Error importando header-loader.js:', error);
                const status = document.getElementById('status');
                status.className = 'status error';
                status.innerHTML = `❌ <strong>Error importando header-loader.js</strong><br>${error.message}`;
            });
    </script>
</body>
</html>
